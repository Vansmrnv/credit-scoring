[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scoring"
version = "0.1.0"
description = "Credit application scoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scoring = ["config/rules.yaml", "db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["src"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["scoring"]
exclude = ["_test\\.py$"]
