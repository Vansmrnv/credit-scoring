services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoring
      POSTGRES_PASSWORD: scoring
      POSTGRES_DB: scoring
    ports:
      - "5433:5432"
    volumes:
      - scoring-data:/var/lib/postgresql/data
      - ./src/scoring/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoring -d scoring"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://scoring:scoring@postgres:5432/scoring
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  scoring-data:
